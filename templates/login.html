<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#16213e">
  <title>Login — HQ Reader</title>
  <link rel="stylesheet" href="/static/css/style.css?v={{ asset_v }}">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
</head>
<body>

<div class="header">
  <a href="/" class="btn-icon" title="Voltar">&#8592;</a>
  <h1 style="font-size:16px;flex:1;margin:0 12px;">Login</h1>
  <span></span>
</div>

<div class="auth-wrap">
  <form class="auth-card" method="post" action="/login">
    <input type="hidden" name="next" value="{{ next_url }}">

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="auth-error">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}

    <label class="auth-label" for="username">Usuário</label>
    <input class="auth-input" type="text" id="username" name="username" autocomplete="username" autocapitalize="off" autocorrect="off" required>

    <label class="auth-label" for="password">Senha</label>
    <input class="auth-input" type="password" id="password" name="password" autocomplete="current-password" required>

    <button class="end-screen-btn" type="submit" style="margin-top:8px;">Entrar</button>
  </form>
</div>

</body>
</html>
