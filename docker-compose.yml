services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./comics:/app/comics
      - ./cache:/app/cache
    expose:
      - "8000"
    networks:
      - webnet

  feeder:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./comics:/app/comics
      - ./cache:/app/cache
    command: ["python", "feeder_worker.py"]
    networks:
      - webnet

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - webnet

networks:
  webnet:
